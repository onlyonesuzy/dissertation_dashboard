<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Question Intelligence Dashboard</title>
  <style>
    :root {
      --bg: #f5f4f8;
      --ink: #231f2e;
      --muted: #7c7585;
      --soft: #f1eef6;
      --line: #e5e1ea;
      --card: #ffffff;
      --purple: #7156d9;
      --purple-dark: #4f3a9e;
      --purple-soft: #eee9fc;
      --green: #3f8060;
      --red: #ac5461;
      --shadow: 0 9px 30px rgba(38, 29, 55, .045);
      --radius: 16px;
      font-family: Inter, Aptos, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 10% -8%, rgba(119, 87, 218, .1), transparent 28rem),
        var(--bg);
      color: var(--ink);
      text-rendering: optimizeLegibility;
    }
    body.modal-open { overflow: hidden; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr);
      align-items: center;
      gap: 22px;
      min-height: 72px;
      padding: 10px clamp(18px, 3.3vw, 52px);
      border-bottom: 1px solid rgba(224, 219, 232, .9);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(113, 86, 217, .28);
      border-radius: 11px;
      background: #f0ecff;
      color: #6e53cf;
    }
    .brand p, .brand span { margin: 0; }
    .brand p { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
    .brand span { display: block; margin-top: 2px; color: #8b8493; font-size: 10.5px; }
    .view-switch {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid #e4dfe9;
      border-radius: 11px;
      background: #f4f1f7;
    }
    .view-switch button {
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #827b8b;
      font-size: 10.5px;
      font-weight: 750;
    }
    .view-switch button.active {
      background: #fff;
      color: #5743aa;
      box-shadow: 0 1px 4px rgba(42, 31, 61, .09);
    }
    .run-control { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    .run-copy { text-align: right; }
    .run-copy span, .run-copy b { display: block; }
    .run-copy span {
      color: #938c9d;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .run-copy b { margin-top: 2px; color: #4c4457; font-size: 11px; }
    .select-wrap, .date-pill {
      display: flex;
      height: 40px;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid #ddd6e7;
      border-radius: 11px;
      background: #fff;
      color: #625a6b;
      box-shadow: 0 1px 2px rgba(34, 25, 52, .03);
    }
    .select-wrap select {
      max-width: 260px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #5f5768;
      font-size: 10.5px;
      font-weight: 700;
    }
    .date-pill { min-width: 164px; font-size: 11px; font-weight: 750; }
    .dashboard-main {
      width: min(1500px, calc(100% - clamp(30px, 6vw, 94px)));
      margin: 0 auto;
      padding: 34px 0 56px;
    }
    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      margin-bottom: 25px;
    }
    .eyebrow, .kicker {
      color: #7a65c4;
      font-size: 9.5px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8064df;
      box-shadow: 0 0 0 4px rgba(128, 100, 223, .12);
    }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 40px); letter-spacing: -.045em; line-height: 1.08; }
    .page-heading .summary {
      max-width: 790px;
      margin: 9px 0 0;
      color: #746e7e;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .context-chip {
      display: flex;
      flex: none;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      border: 1px solid #ddd7e7;
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      color: #675f70;
      font-size: 11px;
      font-weight: 700;
    }
    .context-chip svg { color: var(--purple); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .metric {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      padding: 19px 19px 17px;
      border-right: 1px solid #ece9f0;
    }
    .metric:last-child { border-right: 0; }
    .metric-icon, .section-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 9px;
      background: #f0ecfb;
      color: #7458d1;
    }
    .metric p { margin: 0; }
    .metric-label { color: #827b8c; font-size: 10.5px; font-weight: 700; }
    .metric-value { margin-top: 3px !important; font-size: 23px; font-weight: 820; letter-spacing: -.035em; }
    .metric-note {
      overflow: hidden;
      margin-top: 4px !important;
      color: #9992a1;
      font-size: 9.5px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 338px; gap: 20px; align-items: start; }
    .panel, .insight-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .panel { overflow: hidden; }
    .panel-heading, .insight-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-heading { min-height: 73px; padding: 0 20px; border-bottom: 1px solid #eae7ed; }
    .panel-heading h2, .insight-card h2 { margin: 3px 0 0; font-size: 16px; letter-spacing: -.015em; }
    .result-count {
      padding: 6px 9px;
      border-radius: 8px;
      background: #f2eff7;
      color: #756e81;
      font-size: 10px;
      font-weight: 800;
    }
    .ranking-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .ranking-table thead { background: #faf9fb; }
    .ranking-table th {
      height: 40px;
      padding: 0 11px;
      border-bottom: 1px solid #ece9f0;
      color: #8b8494;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .09em;
      text-align: left;
      text-transform: uppercase;
    }
    .ranking-table td { padding: 14px 11px; border-bottom: 1px solid #eeebf1; vertical-align: middle; }
    .ranking-table tr:last-child td { border-bottom: 0; }
    .ranking-table tbody tr { transition: background 140ms ease; }
    .ranking-table tbody tr:hover { background: #fbfaff; }
    .rank-col { width: 64px; text-align: center !important; }
    .signal-col { width: 74px; text-align: center !important; }
    .deadline-col { width: 108px; }
    .score-col { width: 72px; text-align: center !important; }
    .rank-badge {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid #e4e0e9;
      border-radius: 10px;
      background: #f7f5f9;
      color: #776e82;
      font-size: 10px;
      font-weight: 850;
    }
    .rank-badge.top {
      border-color: #8e74df;
      background: var(--purple);
      color: #fff;
      box-shadow: 0 5px 12px rgba(113, 86, 217, .22);
    }
    .rank-badge.medal { border-color: #d8cff0; background: #eee9fc; color: #654abf; }
    .question-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .question-button:focus-visible { outline: 2px solid rgba(113, 86, 217, .65); outline-offset: 4px; border-radius: 6px; }
    .question-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; color: #98919f; font-size: 9px; font-weight: 750; }
    .asset {
      padding: 3px 6px;
      border: 1px solid #ded7f0;
      border-radius: 5px;
      background: #f4f1fc;
      color: #6650b5;
      font-size: 8.5px;
      letter-spacing: .04em;
    }
    .view-label { margin-left: auto; color: #745fc2; opacity: 0; transition: opacity 140ms ease; }
    tr:hover .view-label, .question-button:focus-visible .view-label { opacity: 1; }
    .question-title { margin: 0; color: #302a39; font-size: 12.5px; font-weight: 720; line-height: 1.42; }
    .rank-reason { margin: 5px 0 0; color: #908997; font-size: 10px; line-height: 1.45; }
    .rank-reason b { color: #7165a0; }
    .future-inline {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-top: 8px;
      padding: 7px 9px;
      border: 1px solid #e5e0eb;
      border-radius: 8px;
      background: #f7f5f9;
      color: #7c7485;
    }
    .future-inline.near { border-color: #cfe5da; background: #f3faf6; color: #3f7b5f; }
    .future-inline.related { border-color: #dcd3f2; background: #f6f3fc; color: #6852b0; }
    .future-inline div { min-width: 0; }
    .future-inline span { display: block; font-size: 8px; font-weight: 850; letter-spacing: .055em; text-transform: uppercase; }
    .future-inline p { overflow: hidden; margin: 2px 0 0; font-size: 9px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .signals { display: inline-flex; height: 28px; align-items: flex-end; gap: 3px; }
    .signals i { display: block; width: 5px; min-height: 6px; border-radius: 4px 4px 2px 2px; }
    .deadline { color: #6f6878; font-size: 10px; font-weight: 700; }
    .score-ring {
      --angle: 0deg;
      position: relative;
      display: inline-grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--purple) var(--angle), #ece9f1 0);
    }
    .score-ring:before {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }
    .score-ring span { position: relative; z-index: 1; font-size: 9px; font-weight: 850; }
    .insights { display: grid; gap: 16px; }
    .insight-card { padding: 18px; }
    .composition { display: grid; gap: 13px; margin-top: 20px; }
    .composition-row { display: grid; grid-template-columns: 23px 1fr 34px; gap: 8px; align-items: center; }
    .composition-row > span { color: #79717f; font-size: 9px; font-weight: 800; }
    .composition-row > span:last-child { text-align: right; }
    .composition-track { display: flex; overflow: hidden; height: 10px; border-radius: 999px; background: #efedf2; }
    .composition-track i { display: block; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 11px; margin-top: 17px; padding-top: 13px; border-top: 1px solid #efecf2; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; color: #8b8493; font-size: 8.5px; font-weight: 700; }
    .legend i { width: 6px; height: 6px; border-radius: 2px; }
    .method-card { position: relative; overflow: hidden; border-color: #2d2640; background: #211b30; color: #fff; }
    .method-card:after {
      position: absolute;
      top: -65px;
      right: -70px;
      width: 170px;
      height: 170px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      box-shadow: 0 0 0 25px rgba(255,255,255,.025), 0 0 0 52px rgba(255,255,255,.016);
      content: "";
    }
    .method-card .kicker { position: relative; z-index: 1; color: #ae9fe5; }
    .method-card h2 { position: relative; z-index: 1; color: #fff; }
    .formula {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 8px;
      margin-top: 15px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      background: rgba(255,255,255,.055);
    }
    .formula span { grid-column: 1 / -1; color: #a69eb4; font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .formula strong { font-size: 10px; color: #f5f2ff; }
    .formula b { color: #9b8cd3; font-size: 10px; }
    .method-card .note { position: relative; z-index: 1; margin: 12px 0 0; color: #aaa2b4; font-size: 9.5px; line-height: 1.55; }
    .method-card .note b { color: #d1c7f3; }
    .mini-total {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 50%;
      background: #eee9fa;
      color: #6b50c7;
      font-size: 10px;
      font-weight: 850;
    }
    .asset-list { display: grid; gap: 10px; margin-top: 17px; }
    .asset-row { display: grid; grid-template-columns: 62px 1fr 16px; gap: 8px; align-items: center; color: #77707f; font-size: 9.5px; }
    .asset-row b { color: #514959; }
    .asset-track { overflow: hidden; height: 5px; border-radius: 999px; background: #eeebf2; }
    .asset-track i { display: block; height: 100%; border-radius: inherit; background: #8970de; }
    .target-box { margin-top: 16px; padding: 13px 14px; border: 1px solid #ded7ef; border-left: 3px solid var(--purple); border-radius: 0 10px 10px 0; background: #f7f4fd; }
    .target-box span, .target-box small { display: block; color: #8c8398; font-size: 8px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .target-box p { margin: 6px 0 7px; color: #51475c; font-size: 10.5px; font-weight: 720; line-height: 1.5; }
    .target-box small { color: #99919f; font-weight: 650; letter-spacing: 0; text-transform: none; }
    .match-grid { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; margin-top: 12px; border: 1px solid #e9e5ed; border-radius: 10px; }
    .match-grid div { padding: 10px 6px; border-right: 1px solid #e9e5ed; text-align: center; }
    .match-grid div:last-child { border-right: 0; }
    .match-grid b, .match-grid span { display: block; }
    .match-grid b { color: #57449e; font-size: 16px; }
    .match-grid span { margin-top: 2px; color: #908895; font-size: 7.5px; }
    .matching-note { margin: 11px 0 0; color: #89818f; font-size: 9px; line-height: 1.5; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(24, 19, 32, .48);
      backdrop-filter: blur(5px);
    }
    .modal-backdrop.hidden { display: none; }
    .dialog {
      display: flex;
      width: min(850px, 100%);
      max-height: min(880px, calc(100vh - 44px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #dcd7e3;
      border-radius: 18px;
      background: #f6f5f8;
      box-shadow: 0 30px 90px rgba(23, 17, 33, .28);
    }
    .dialog-header { position: relative; padding: 25px 31px 22px; border-bottom: 1px solid #e7e3eb; background: #fff; }
    .dialog-meta { display: flex; align-items: center; gap: 8px; color: #958d9c; font-size: 9px; font-weight: 750; }
    .dialog-title { max-width: 720px; margin: 12px 52px 0 0; color: #292332; font-size: 20px; line-height: 1.36; letter-spacing: -.025em; }
    .dialog-subtitle { margin: 7px 0 0; color: #8b8493; font-size: 10px; }
    .close {
      position: absolute;
      top: 20px;
      right: 21px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: #f1eef5;
      color: #716a7a;
      font-size: 20px;
    }
    .dialog-tabs { display: flex; flex: none; gap: 17px; overflow-x: auto; min-height: 48px; padding: 0 31px; border-bottom: 1px solid #e7e3eb; background: #fff; }
    .dialog-tabs button {
      flex: none;
      padding: 0 1px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #8b8494;
      font-size: 10.5px;
      font-weight: 750;
    }
    .dialog-tabs button.active { border-bottom-color: var(--purple); color: #5541a7; }
    .dialog-scroll { min-height: 0; overflow-y: auto; padding: 21px 31px 38px; }
    .detail-stack { display: grid; gap: 15px; }
    .why-card {
      position: relative;
      overflow: hidden;
      padding: 19px;
      border: 1px solid #2e2740;
      border-radius: 15px;
      background: #221c31;
      color: #fff;
    }
    .why-card:after {
      position: absolute;
      top: -55px;
      right: -44px;
      width: 140px;
      height: 140px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(255,255,255,.025), 0 0 0 47px rgba(255,255,255,.015);
      content: "";
    }
    .why-card .why-label { position: relative; z-index: 1; color: #bcaeef; font-size: 9px; font-weight: 850; letter-spacing: .07em; text-transform: uppercase; }
    .why-card > p { position: relative; z-index: 1; max-width: 650px; margin: 11px 0 0; color: #d2ccd9; font-size: 11px; line-height: 1.65; }
    .equation { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-top: 15px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.09); }
    .equation span { display: flex; flex-direction: column; gap: 2px; color: #968da1; font-size: 8px; text-transform: uppercase; }
    .equation span b { color: #f4f0ff; font-size: 16px; }
    .equation i { color: #776c83; font-style: normal; }
    .equation > b { color: #b8a8ef; font-size: 20px; }
    .detail-card, .evidence-card, .validation-hero, .audit-card, .future-status, .comparison-card {
      border: 1px solid #e5e1e9;
      border-radius: 15px;
      background: #fff;
    }
    .detail-card { padding: 19px; }
    .section-heading { display: flex; align-items: center; gap: 10px; }
    .section-heading p, .section-heading h3 { margin: 0; }
    .section-heading p { color: #8d8597; font-size: 8px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .section-heading h3 { margin-top: 2px; color: #3a3343; font-size: 12.5px; }
    .breakdowns { display: grid; gap: 13px; margin-top: 18px; }
    .breakdown-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: #5a5064; font-size: 9.5px; }
    .breakdown-top span { color: #948c9b; font-size: 8.5px; }
    .bar { overflow: hidden; height: 5px; border-radius: 999px; background: #efecf2; }
    .bar i { display: block; height: 100%; border-radius: inherit; }
    .total { display: flex; justify-content: space-between; margin-top: 17px; padding-top: 13px; border-top: 1px solid #eeebf1; color: #827a8b; font-size: 9.5px; }
    .total b { color: #4e3b99; font-size: 12px; }
    .specs { display: grid; margin: 17px 0 0; }
    .specs div { display: grid; grid-template-columns: 126px 1fr; gap: 13px; padding: 11px 0; border-top: 1px solid #efecf2; }
    .specs dt { color: #958e9d; font-size: 8px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .specs dd { margin: 0; color: #5e5667; font-size: 10px; line-height: 1.6; }
    .evidence-card { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 18px; }
    .evidence-card h3, .evidence-card .overline { margin: 0; }
    .evidence-card .overline { color: #8d8597; font-size: 8px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .evidence-card h3 { margin-top: 3px; color: #3a3343; font-size: 12.5px; line-height: 1.45; }
    .evidence-card .body-copy { margin: 9px 0 0; color: #665e6f; font-size: 10px; line-height: 1.6; }
    .reason-box { margin-top: 9px; padding: 10px 11px; border-radius: 9px; background: #f7f5f9; color: #81798a; font-size: 9.5px; line-height: 1.55; }
    .evidence-card a { display: inline-flex; margin-top: 10px; color: #6650bd; font-size: 9.5px; font-weight: 750; text-decoration: none; }
    .evidence-stats { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; margin-top: 12px; border: 1px solid #e9e5ed; border-radius: 10px; }
    .evidence-stats div { padding: 9px 10px; border-right: 1px solid #e9e5ed; color: #99919f; font-size: 8px; }
    .evidence-stats div:last-child { border-right: 0; }
    .evidence-stats b { display: block; overflow: hidden; margin-bottom: 2px; color: #4f4759; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .reference { margin-top: 11px; padding: 10px 11px; border-left: 3px solid #8a70dd; border-radius: 0 8px 8px 0; background: #f5f2fc; }

    }
    function sectionHeading(iconName, overline, title) {
      return '<div class="section-heading"><div class="section-icon">' + icon(iconName, 15) + '</div><div><p>' + esc(overline) + '</p><h3>' + esc(title) + '</h3></div></div>';
    }
    function breakdown(label, raw, contribution, weight, color) {
      return '<div><div class="breakdown-top"><div><b>' + esc(label) + '</b> <span>' + percent(raw) + " × " + weight + '</span></div><b>' + points(contribution) + ' pts</b></div><div class="bar"><i style="width:' + (Number(raw) * 100) + '%;background:' + color + '"></i></div></div>';
    }
    function overviewTab(q, snap) {
      return '<div class="detail-stack"><section class="why-card"><span class="why-label">Why it ranks #' + q.rank + '</span><p>' + esc(rankReason(q, snap)) + '</p>' +
        '<div class="equation"><span><b>' + points(q.metrics.eventRank * .7) + '</b>Event relevance × 70%</span><i>+</i><span><b>' + points(q.metrics.qualityContribution) + '</b>Question quality × 30%</span><i>=</i><b>' + points(q.score) + '</b></div></section>' +
        '<section class="detail-card">' + sectionHeading("trend", "Weighted contribution", "Score breakdown") + '<div class="breakdowns">' +
        breakdown("News relevance", q.metrics.news, q.metrics.newsContribution, "42%", "#7557d7") +
        breakdown("Polymarket demand", q.metrics.polymarket, q.metrics.polymarketContribution, "17.5%", "#9d88e8") +
        breakdown("Deribit context", q.metrics.deribit, q.metrics.deribitContribution, "10.5%", "#c4b5f2") +
        breakdown("Question quality", q.metrics.quality, q.metrics.qualityContribution, "30%", "#211b35") +
        '</div><div class="total"><span>Total model score</span><b>' + points(q.score) + ' / 100</b></div></section>' +
        '<section class="detail-card">' + sectionHeading("shield", "Market specification", "Resolution design") + '<dl class="specs"><div><dt>Deadline</dt><dd>' + esc(dateLabel(q.deadline)) + '</dd></div><div><dt>Resolution criteria</dt><dd>' + esc(q.resolutionCriteria || "Not recorded") + '</dd></div><div><dt>Generation rationale</dt><dd>' + esc(q.rationale || "Not recorded") + '</dd></div></dl></section></div>';
    }
    function evidenceCard(iconName, overline, title, content) {
      return '<section class="evidence-card"><div class="section-icon">' + icon(iconName, 16) + '</div><div><p class="overline">' + esc(overline) + '</p><h3>' + esc(title) + '</h3>' + content + '</div></section>';
    }
    function evidenceTab(q) {
      const news = '<p class="body-copy">' + esc(q.eventSummary || "No summary recorded.") + '</p>' +
        (q.eventReasoning ? '<div class="reason-box">' + esc(q.eventReasoning) + '</div>' : "") +
        '<p class="body-copy">' + esc((q.eventSource || "Source article") + " · " + dateLabel((q.published || "").slice(0, 10))) + '</p>' + safeLink(q.eventUrl, "Open evidence source");
      const pmTitle = q.polymarket.marketCount > 0 ? q.polymarket.marketCount + " related active markets" : "No active market signal";
      const pm = '<div class="evidence-stats"><div><b>' + percent(q.polymarket.opportunity) + '</b>Opportunity</div><div><b>' + money(q.polymarket.demandVolume) + '</b>Demand volume</div><div><b>' + esc(labelize(q.polymarket.matchType)) + '</b>Match type</div></div>' +
        (q.polymarket.bestQuestion ? '<div class="reference"><span>Closest reference market</span><p>' + esc(q.polymarket.bestQuestion) + '</p></div>' : "") +
        '<div class="reason-box">' + esc(q.polymarket.reason || q.polymarket.coverageReason || "No additional Polymarket context was recorded.") + '</div>';
      const deribitTitle = q.deribit.indexName ? q.deribit.indexName.toUpperCase() + " · " + labelize(q.deribit.alignment) : "Deribit unavailable for this asset";
      const deribit = q.deribit.indexName
        ? '<div class="evidence-stats"><div><b>' + percent(q.deribit.return24h, 2) + '</b>24h index move</div><div><b>' + esc(labelize(q.deribit.direction)) + '</b>Price direction</div><div><b>' + percent(q.metrics.deribit) + '</b>Information score</div></div><div class="reason-box">' + esc(q.deribit.summary || "No summary recorded.") + '</div>'
        : '<p class="body-copy">' + esc(q.deribit.summary || "No Deribit context was available for this asset.") + '</p>';
      return '<div class="detail-stack">' + evidenceCard("news", "News grounding", q.eventTitle || "Source event", news) + evidenceCard("database", "Polymarket context", pmTitle, pm) + evidenceCard("trend", "Deribit context", deribitTitle, deribit) + '</div>';
    }
    function validationTab(q) {
      const checks = Object.entries(q.validation.checks || {}).map(function(item) {
        return '<div class="check-item ' + (item[1] ? "" : "fail") + '"><b>' + (item[1] ? "✓" : "×") + '</b>' + esc(labelize(item[0])) + '</div>';
      }).join("");
      return '<div class="detail-stack"><section class="validation-hero"><div class="check-circle">✓</div><div><strong>' + (q.validation.valid ? "Passed strict validation" : "Validation review required") + '</strong><p>This question was checked for factual, temporal and resolution quality.</p></div></section>' +
        '<section class="detail-card">' + sectionHeading("shield", "Automated audit", "Validation checks") + '<div class="checks">' + (checks || '<div class="check-item">No individual checks recorded</div>') + '</div></section>' +
        '<section class="audit-card"><div><span>Deadline grounding</span><b>' + esc(q.validation.deadlineEvidence || "Not recorded") + '</b><p>' + esc(labelize(q.validation.deadlineBasis) + " · " + labelize(q.validation.deadlineRule)) + '</p></div><div><span>Duplicate review</span><b>' + esc(labelize(q.validation.duplicateLabel)) + '</b><p>' + esc(q.validation.duplicateReason || "No duplicate issue recorded.") + '</p></div></section>' +
        safeLink(q.resolutionSource, "View resolution source") .replace('<a ', '<a class="resolution-link" ') + '</div>';
    }
    function futureTab(q) {
      const m = q.futureMatch;
      const copy = matchInfo(m);
      return '<div class="detail-stack"><section class="future-status ' + esc(m.matchLabel) + '"><div class="section-icon">' + icon("target", 18) + '</div><div><div class="status-badges"><span>' + esc(copy.label) + '</span><span>' + percent(m.matchScore, 1) + ' similarity</span></div><h3>Subsequently created Polymarket comparison</h3><p>' + esc(copy.note) + '</p></div></section>' +
        '<section class="comparison"><div class="comparison-card"><span>Generated at cutoff</span><p>' + esc(q.question) + '</p></div><div class="comparison-arrow">⇄</div><div class="comparison-card later"><span>Later Polymarket question</span><p>' + esc(m.marketQuestion) + '</p><small>Gamma market #' + esc(m.gammaMarketId) + '</small></div></section>' +
        '<section class="detail-card">' + sectionHeading("database", "Observed after cutoff", "Match evidence") + '<div class="future-stats"><div><span>Created</span><b>' + esc(dateTime(m.createdAt)) + '</b></div><div><span>Similarity score</span><b>' + percent(m.matchScore, 1) + '</b></div><div><span>Deadline gap</span><b>' + Math.abs(Number(m.deadlineGapDays)).toFixed(1) + ' days</b></div><div><span>Observed volume</span><b>' + money(m.futureVolume) + '</b></div><div><span>0.80 formal hit</span><b class="' + (m.formalHit ? "" : "no") + '">' + (m.formalHit ? "Yes" : "No") + '</b></div><div><span>0.75 review label</span><b>' + esc(copy.label) + '</b></div></div><p class="future-note">The closest subsequently created market is shown at the 0.75 review threshold. A formal hit requires the stricter 0.80 evaluation threshold.</p></section>' +
        '<section class="detail-card">' + sectionHeading("shield", "Later market", "Resolution design") + '<p class="future-note">' + esc(m.description) + '</p></section></div>';
    }
    function renderModal() {
      const root = document.getElementById("modal-root");
      const snap = snapshot();
      const q = snap.questions.find(function(item) { return item.questionId === state.questionId; });
      if (!q) {
        root.className = "modal-backdrop hidden";
        root.innerHTML = "";
        document.body.classList.remove("modal-open");
        return;
      }
      const tabs = [["overview", "Overview"], ["evidence", "Evidence"], ["validation", "Validation"]];
      if (q.futureMatch) tabs.push(["future", "Later Polymarket"]);
      if (!tabs.some(function(item) { return item[0] === state.tab; })) state.tab = "overview";
      let content = state.tab === "overview" ? overviewTab(q, snap) : state.tab === "evidence" ? evidenceTab(q) : state.tab === "validation" ? validationTab(q) : futureTab(q);
      root.className = "modal-backdrop";
      root.innerHTML = '<article class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-header"><button class="close" data-close aria-label="Close details">×</button><div class="dialog-meta"><span class="asset">' + esc(q.asset) + '</span><span>' + esc(labelize(q.eventType)) + '</span><span>Rank #' + q.rank + '</span></div><h2 id="dialog-title" class="dialog-title">' + esc(q.question) + '</h2><p class="dialog-subtitle">Ranked #' + q.rank + ' of ' + snap.questions.length + ' for ' + esc(snap.label) + (snap.kind === "backtest" ? " cutoff." : ".") + '</p></header>' +
        '<nav class="dialog-tabs" role="tablist">' + tabs.map(function(item) { return '<button role="tab" aria-selected="' + (state.tab === item[0]) + '" class="' + (state.tab === item[0] ? "active" : "") + '" data-tab="' + item[0] + '">' + item[1] + '</button>'; }).join("") + '</nav><div class="dialog-scroll">' + content + '</div></article>';
      document.body.classList.add("modal-open");
    }
    document.addEventListener("click", function(event) {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.getAttribute("data-view");
        state.questionId = null;
        state.tab = "overview";
        render();
        return;
      }
      const questionButton = event.target.closest("[data-question]");
      if (questionButton) {
        state.questionId = questionButton.getAttribute("data-question");
        state.tab = "overview";
        renderModal();
        return;
      }
      const tabButton = event.target.closest("[data-tab]");
      if (tabButton) {
        state.tab = tabButton.getAttribute("data-tab");
        renderModal();
        return;
      }
      if (event.target.closest("[data-close]") || event.target.id === "modal-root") {
        state.questionId = null;
        renderModal();
      }
    });
    document.addEventListener("change", function(event) {
      if (event.target.id === "cutoff-select") {
        state.snapshotId = event.target.value;
        state.questionId = null;
        state.tab = "overview";
        render();
      }
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && state.questionId) {
        state.questionId = null;
        renderModal();
      }
    });
    render();
  </script>
</body>
</html>
